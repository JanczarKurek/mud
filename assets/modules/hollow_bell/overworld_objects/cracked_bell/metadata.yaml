extends: static_world
name: The Hollow Bell
description: Waist-high and then some, pale bronze gone dark with two hundred years of hands, hanging from an iron frame in the centre of the chamber. A single split runs from lip to crown. There is no tongue in it. Struck, it makes the sound of a cracked pot, and nothing at all in the delve is listening.
