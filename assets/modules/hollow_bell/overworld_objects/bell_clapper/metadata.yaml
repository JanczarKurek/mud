description: A heavy pitted iron bell-clapper the length of your forearm, the striking end polished mirror-bright by two hundred years of dawns. It is heavier than it has any business being, and Tobin will tell you at length that this is precisely the point — you cannot pour two centuries of getting hit into a mould. You can only fetch it back.
