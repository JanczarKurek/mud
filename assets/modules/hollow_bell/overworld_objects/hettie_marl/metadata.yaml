extends: npc
name: Hettie Marl
description: A lean otter in a patched canvas jacket and knee-boots, hair cropped to the skull, a coil of rope always over one shoulder. Three weeks behind a rock-fall on sump-water and two candles, and she will tell you it was restful.
level: 7
dialog_node: HollowBellHettie
