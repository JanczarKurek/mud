npc_behavior:
  hostile: false
  step_interval_seconds: 1.1
  idle_pause_chance: 0.5
  detect_distance_tiles: 5
  disengage_distance_tiles: 7
chatter:
  radius_tiles: 4
  greetings:
    - "Buying or gawping?"
    - "Mind the rope."
    - "Ha! You're still alive as well."
  topics:
    - - "Three weeks, Hettie."
      - "Twenty-two days. I counted the drips, it's very reliable."
      - "...That's worse. You know that's worse."
    - - "Prices are insulting."
      - "Prices are *survival*, Captain, and I'm the only one down there who came back up with stock."
      - "Aye. Fair."
    - - "You'll not go down again."
      - "I'll go down tomorrow."
      - "Hettie —"
      - "I'll go down tomorrow, Marten."
barks:
  mutter:
    - "*coils the rope tighter*"
    - "*counts something under her breath*"
    - "Still here. Still here."
