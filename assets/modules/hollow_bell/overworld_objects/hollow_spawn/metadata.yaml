extends: npc
name: Hollow Spawn
description: Not a child of the thing below — a piece of its dreaming, which is different and worse. Eyeless, mole-clawed, roughly the shape of a person. They dig out of the walls.
level: 12
stats:
  strength: 17
  agility: 11
  constitution: 15
  willpower: 10
  charisma: 3
  focus: 8
# Budget: mean damage ≈ 2+1.3·12 ≈ 18; mean HP ≈ 20+11·12 ≈ 152.
damage: "2d8+9"
attack_profile:
  kind: melee
  damage_type: earth
hp: "3d10+100+constitution*4"
armor: 3
loot:
  corpse_despawn_seconds: 60
  drops:
    - type_id: silver_coin
      quantity: "uniform(2, 12)"
      probability: 1.0
    - type_id: gold_coin
      quantity: 1
      probability: 0.3
    - type_id: hollow_bell/bell_bronze_ore
      quantity: 1
      probability: 0.2
    - type_id: hollow_bell/deep_iron_shard
      quantity: 1
      probability: 0.25
npc_behavior:
  step_interval_seconds: 0.9
  detect_distance_tiles: 9
  disengage_distance_tiles: 18
barks:
  aggro:
    - "*earth splits open*"
    - "*a sound like something enormous rolling over, very far below*"
  mutter:
    - "*claws working at the rock*"
    - "*a faint blue glow pulses in the cracks*"
render:
  debug_color: [58, 52, 48]
  debug_size: 0.98
  sprite_path: modules/hollow_bell/overworld_objects/hollow_spawn/sprite.png
  y_sort: true
  animation:
    sheet_path: modules/hollow_bell/overworld_objects/hollow_spawn/sheet.png
    frame_width: 32
    frame_height: 48
    sheet_columns: 4
    sheet_rows: 2
    clips:
      idle:
        row: 0
        start_col: 0
        frame_count: 4
        fps: 3.0
        looping: true
      walk:
        row: 1
        start_col: 0
        frame_count: 4
        fps: 8.0
        looping: true
