name: Fireball
incantation: Exori Flam Vis
mana_cost: 22.0
targeting: targeted_tile
range_tiles: 6
# class_access: [Wizard]
# min_caster_level: 4
effects:
  # Big AoE nuke (radius 2): the cost buys the footprint, not per-target burst.
  damage: "2d6+foc_mod+level/2"
  damage_type: fire
  # A flung fireball: the missile flies to the target tile, then the blast
  # blooms outward ring-by-ring from the impact point.
  projectile:
    sprite: fireball_missile
    speed_tiles_per_second: 9.0
  aoe:
    radius_tiles: 2
    vfx_on_tile: fire_hit
    pattern:
      kind: spread
      ring_delay_seconds: 0.1
  vfx_on_target_hit: fire_hit
