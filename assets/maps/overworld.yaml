  - type: bookshelf
    placement: { x: 96, y: 71 }
    facing: south
  - type: cabinet
    placement: { x: 97, y: 71 }
    facing: south
  # (98,71) stays free — travellers climbing out of the cellar arrive there.
  - type: sinkhole                # trapdoor down to the tavern cellar
    placement: { x: 99, y: 71 }
  - type: rug
    placement: { x: 96, y: 69 }
  - type: table
    placement: { x: 96, y: 69 }
  - type: book                    # readable lore volume on the table
    placement: { x: 96, y: 69 }
    properties:
      title: "The Ember Valley Almanac"
      text: "Founder Aldric Ember raised this village between river and hills, and set it a long walk from anything that bites. His plate and shield were lost below the sinkhole when the wight took him. The goblins of Thornwood steal anything not nailed down - lately the storehouse key. Rest by a fire to recover; eat well and wounds close faster."
  - type: chair
    placement: { x: 95, y: 69 }
    facing: east
  - type: chair
    placement: { x: 97, y: 69 }
    facing: west
  - type: chair
    placement: { x: 96, y: 68 }
    facing: north
  - type: chair
    placement: { x: 96, y: 70 }
    facing: south
  - type: bench
    placement: { x: 97, y: 67 }
    facing: south
  - type: barrel
    placement: { x: 99, y: 67 }
    contents:
