objects:
  # ==== EMBERBROOK VILLAGE ==================================================
  # -- plaza ------------------------------------------------------------------
  - type: well
    placement: { x: 88, y: 63 }
  - type: sign_post
    placement: { x: 91, y: 64 }
    properties:
      text: "Welcome to Emberbrook. West over the bridge: the fields and the pasture. North: Thornwood - mind the goblins. East: the Cinder Hills and the Proving Grounds arch. South: the Old Yard. It is a fair walk to any of them, and further back. Rest easy inside the village."

  # -- general store (door on the south wall) ----------------------------------
  - type: wooden_door_s
    placement: { x: 85, y: 68 }
  - type: villager                # shopkeeper + the apple/hunter quest chain
    placement: { x: 86, y: 70 }
  - type: table                   # shop counter
    placement: { x: 85, y: 70 }
  - type: cabinet
    placement: { x: 87, y: 71 }
    facing: south
  - type: crate
    placement: { x: 83, y: 71 }
  - type: barrel
    placement: { x: 83, y: 69 }
    contents:
      - type: apple
        quantity: 5
  - type: crate                   # market stall out front
    placement: { x: 86, y: 67 }

  # -- The Gilded Toad tavern (door on the south wall) --------------------------
  - type: wooden_door_s
    placement: { x: 95, y: 66 }
  - type: torch                   # street lamps flanking the door
    placement:
      - { x: 94, y: 65 }
      - { x: 96, y: 65 }
  - type: blazing_fire            # the hearth
    placement: { x: 99, y: 69 }
  - type: bed
    placement: { x: 94, y: 71 }
