  - type: campfire
    placement: { x: 79, y: 69 }
  - type: bench
    placement: { x: 78, y: 69 }
    facing: east
  - type: bench
    placement: { x: 80, y: 69 }
    facing: west

  # -- villagers -------------------------------------------------------------------
  # Stallkeeper: minds the market stall by day, sleeps in the tavern at night.
  - type: townsfolk
    placement: { x: 87, y: 66 }
    routine:
      schedule:
        - { from: 0.27, to: 0.75, activity: work, at: { x: 87, y: 67 }, face: west }
        - { from: 0.80, to: 0.22, activity: sleep, at: { x: 95, y: 70 }, face: west }
  # Road warden: walks the village stretch of the main road and no further.
  # Routines ignore RoamBounds entirely, so the waypoints themselves are the
  # only limit — don't send a killable townsfolk out into the buffer.
  - type: townsfolk
    placement: { x: 84, y: 65 }
    routine:
      patrol:
        mode: ping_pong
        waypoints:
          - { x: 80, y: 65, dwell: 3.0 }
          - { x: 100, y: 65, dwell: 3.0 }
  # Gossip pair by the well (ambient chatter demo).
  - type: townsfolk
    placement: { x: 88, y: 62 }
    behavior:
      kind: roam
      bounds: { min_x: 86, min_y: 61, max_x: 91, max_y: 64 }
  - type: townsfolk
    placement: { x: 89, y: 62 }
    behavior:
      kind: roam
      bounds: { min_x: 86, min_y: 61, max_x: 91, max_y: 64 }
  # Gate guards: posted at the west and east ends of the village stretch, tight
  # roam bounds so they hold their posts. Their template's `hostile_towards:
  # [monster, undead]` gives them combat AI without map hostility. Hand-placed
  # (no spawn group), so a fallen gate guard stays down until a map reload —
  # the roaming `village_guards` spawn group is the renewable muscle.
  - type: town_guard
    placement: { x: 79, y: 65 }
    facing: west
    behavior:
