    properties:
      text: "Three weeks now, and the bell has not rung once. My grandmother would have known what that meant. — scratched below the notice, in a shaky hand"

# Spawn groups.
#
# `behavior:` here accepts ONLY `kind` and `bounds` — `MapBehavior` has no
# other fields, so `step_interval_seconds` / `detect_distance_tiles` /
# `disengage_distance_tiles` written in this block are silently dropped by
# serde (they used to be, and misled every reader). Those knobs live on the
# creature's `npc_behavior:` in assets/overworld_objects/<id>/metadata.yaml.
#
# `bounds` is NOT validated against the map dimensions at load — a typo here
# yields a silently-wrong NPC rather than a panic. Every rectangle below is
# at least 24 tiles clear of the `village_guards` rectangle; keep it so.
spawn_groups:
  # L1 — the hunter quest's rats, far paddocks beyond the Ember.
  - id: field_rats
    template: rat
    max_count: 4
    respawn_mean_seconds: 45.0
    area:
      bounds: { min_x: 12, min_y: 44, max_x: 34, max_y: 62 }
    behavior:
      kind: roam_and_chase
      bounds: { min_x: 10, min_y: 42, max_x: 36, max_y: 64 }

  # L2 — goblin watch roaming the mid-forest.
  - id: thornwood_goblins
    template: goblin
    max_count: 3
    respawn_mean_seconds: 90.0
    area:
      bounds: { min_x: 66, min_y: 104, max_x: 114, max_y: 116 }
    behavior:
      kind: roam_and_chase
      bounds: { min_x: 62, min_y: 100, max_x: 118, max_y: 122 }

  # L2-3 — the stockade: melee escort, archers, and a caster.
  - id: camp_goblins
    template: goblin
    max_count: 2
    respawn_mean_seconds: 120.0
    area:
      bounds: { min_x: 146, min_y: 105, max_x: 162, max_y: 113 }
    behavior:
      kind: roam_and_chase
      bounds: { min_x: 140, min_y: 100, max_x: 168, max_y: 120 }
  - id: camp_archers
    template: archer_goblin
    max_count: 2
    respawn_mean_seconds: 180.0
    area:
      bounds: { min_x: 146, min_y: 105, max_x: 162, max_y: 113 }
    behavior:
      kind: roam_and_chase
      bounds: { min_x: 138, min_y: 98, max_x: 170, max_y: 122 }
  - id: camp_mage
    template: goblin_mage
    max_count: 1
    respawn_mean_seconds: 300.0
    area:
      bounds: { min_x: 150, min_y: 107, max_x: 158, max_y: 111 }
    behavior:
      kind: roam_and_chase
      bounds: { min_x: 142, min_y: 102, max_x: 166, max_y: 118 }

  # L3 — restless dead of the Old Yard. Bounded by the hedge: they do not walk
  # the south road, and the village is 38 tiles further on.
  - id: yard_skeletons
    template: skeleton
    max_count: 3
    respawn_mean_seconds: 150.0
    area:
      bounds: { min_x: 80, min_y: 9, max_x: 91, max_y: 15 }
    behavior:
      kind: roam_and_chase
      bounds: { min_x: 79, min_y: 8, max_x: 99, max_y: 16 }

  # L6 — the glade's guardian.
  - id: glade_elemental
    template: fire_elemental
    max_count: 1
    respawn_mean_seconds: 360.0
    area:
      bounds: { min_x: 142, min_y: 56, max_x: 154, max_y: 74 }
    behavior:
      kind: roam_and_chase
      bounds: { min_x: 138, min_y: 52, max_x: 158, max_y: 78 }

  # L8 — the cyclops of the high hills.
  - id: hill_cyclops
    template: cyclops
    max_count: 1
    respawn_mean_seconds: 600.0
    area:
      bounds: { min_x: 152, min_y: 12, max_x: 170, max_y: 24 }
    behavior:
      kind: roam_and_chase
