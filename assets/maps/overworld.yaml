# Floors. Rects are disjoint by construction except cave_floor (Cinder Hills)
# under the eastern road tiles — cave_floor is listed first so the road wins.
floors:
  cave_floor:
    rects:
      - { x: 48, y: 2, w: 21, h: 35 }     # Cinder Hills
  water:
    rects:
      - { x: 18, y: 1, w: 3, h: 23 }      # the Ember, south of the bridge
      - { x: 18, y: 27, w: 3, h: 22 }     # the Ember, north of the bridge
  sand:
    rects:
      - { x: 17, y: 1, w: 1, h: 23 }      # west bank
      - { x: 21, y: 1, w: 1, h: 23 }      # east bank
      - { x: 17, y: 27, w: 1, h: 22 }
      - { x: 21, y: 27, w: 1, h: 22 }
  cobblestone:
    rects:
      - { x: 30, y: 22, w: 11, h: 7 }     # village plaza (spawn is 35,25)
      - { x: 17, y: 24, w: 5, h: 3 }      # Ember Bridge
  dirt_path:
    rects:
      - { x: 21, y: 24, w: 9, h: 3 }      # west road: bridge -> plaza
      - { x: 41, y: 24, w: 9, h: 2 }      # east road: plaza -> arch/hills
      - { x: 50, y: 24, w: 2, h: 3 }      # spur into the hills
      - { x: 34, y: 29, w: 3, h: 12 }     # north road: plaza -> Thornwood
      - { x: 31, y: 11, w: 4, h: 11 }     # south road: plaza -> Old Yard
  wooden_floor:
    rects:
      - { x: 28, y: 29, w: 5, h: 3 }      # general store interior
      - { x: 39, y: 27, w: 6, h: 5 }      # tavern interior
      - { x: 25, y: 17, w: 5, h: 3 }      # storehouse interior
      # Tavern loft (upper storey, floor index 1). The stairwell column
      # (39,28)-(39,29) stays unpainted so the staircase can pass through;
      # (39,27) is the landing. Covered tiles below read as "indoors".
      - { x: 39, y: 27, w: 6, h: 1, z: 1 }
      - { x: 40, y: 28, w: 5, h: 2, z: 1 }
      - { x: 39, y: 30, w: 6, h: 2, z: 1 }
  flagstone:
    rects:
      - { x: 37, y: 4, w: 4, h: 3 }       # crypt interior

portals:
  # Trapdoor in the tavern's back corner, down to the (ephemeral) cellar.
  - id: cellar_hatch
    source: { x: 44, y: 31 }
    destination_space_id: starter_cellar
    destination_tile: { x: 6, y: 1 }
    destination_permanence: ephemeral
  # Sinkhole in the Cinder Hills, down to the persistent underworld.
  - id: underworld_sinkhole
    source: { x: 58, y: 16 }
    destination_space_id: underworld
    destination_tile: { x: 3, y: 14 }
  # Arch at the end of the east road: the systems-tutorial dungeon.
  - id: proving_grounds_entrance
    source: { x: 47, y: 25 }
    destination_space_id: proving_grounds
    destination_tile: { x: 14, y: 12 }
  # SW moor road: down the cage lift into the Hollow Bell delve.
  - id: hollow_bell_entrance
    source: { x: 6, y: 45 }
    destination_space_id: hollow_bell/pithead
    destination_tile: { x: 10, y: 18 }

objects:
  # ==== EMBERBROOK VILLAGE ==================================================
  # -- plaza ------------------------------------------------------------------
  - type: well
    placement: { x: 33, y: 23 }
  - type: sign_post
    placement: { x: 36, y: 24 }
    properties:
      text: "Welcome to Emberbrook. West over the bridge: the fields. North: Thornwood - mind the goblins. East: the Cinder Hills and the Proving Grounds arch. South: the Old Yard. Rest easy inside the village."

  # -- general store (door on the south wall) ----------------------------------
  - type: wooden_door_s
    placement: { x: 30, y: 28 }
  - type: villager                # shopkeeper + the apple/hunter quest chain
    placement: { x: 31, y: 30 }
  - type: table                   # shop counter
    placement: { x: 30, y: 30 }
  - type: cabinet
    placement: { x: 32, y: 31 }
    facing: south
  - type: crate
    placement: { x: 28, y: 31 }
  - type: barrel
    placement: { x: 28, y: 29 }
    contents:
      - type: apple
        quantity: 5
  - type: crate                   # market stall out front
    placement: { x: 31, y: 27 }

  # -- The Gilded Toad tavern (door on the south wall) --------------------------
  - type: wooden_door_s
    placement: { x: 40, y: 26 }
  - type: torch                   # street lamps flanking the door
    placement:
      - { x: 39, y: 25 }
      - { x: 41, y: 25 }
  - type: blazing_fire            # the hearth
    placement: { x: 44, y: 29 }
  - type: bed
    placement: { x: 39, y: 31 }
    facing: east
  - type: side_table
    placement: { x: 40, y: 31 }
  - type: pen                     # for writing in the guest book
    placement: { x: 40, y: 31 }
  - type: bookshelf
    placement: { x: 41, y: 31 }
    facing: south
  - type: cabinet
    placement: { x: 42, y: 31 }
    facing: south
  # (43,31) stays free — travellers climbing out of the cellar arrive there.
  - type: sinkhole                # trapdoor down to the tavern cellar
    placement: { x: 44, y: 31 }
  - type: rug
    placement: { x: 41, y: 29 }
  - type: table
    placement: { x: 41, y: 29 }
  - type: book                    # readable lore volume on the table
    placement: { x: 41, y: 29 }
    properties:
      title: "The Ember Valley Almanac"
      text: "Founder Aldric Ember raised this village between river and hills. His plate and shield were lost below the sinkhole when the wight took him. The goblins of Thornwood steal anything not nailed down - lately the storehouse key. Rest by a fire to recover; eat well and wounds close faster."
  - type: chair
    placement: { x: 40, y: 29 }
    facing: east
  - type: chair
    placement: { x: 42, y: 29 }
    facing: west
  - type: chair
    placement: { x: 41, y: 28 }
    facing: north
  - type: chair
    placement: { x: 41, y: 30 }
    facing: south
  - type: bench
    placement: { x: 42, y: 27 }
    facing: south
  - type: barrel
    placement: { x: 44, y: 27 }
    contents:
      - type: apple
        quantity: 3
      - type: berries
        quantity: 2
  - type: chatterbox              # the tavern bard (dialog demo)
    placement: { x: 43, y: 28 }
  # Staircase to the loft: step south from (39,30) up the ramp, landing on
  # the upper storey at (39,27). Same low/high pattern as proving_grounds.
  - type: stair_n_low
    placement: { x: 39, y: 29 }
  - type: stair_n_high
    placement: { x: 39, y: 28 }

  # -- storehouse (locked; the goblins stole the key) ----------------------------
  - type: wooden_door_n
    placement: { x: 27, y: 20 }
    properties:
      state: locked
  - type: sign_post
    placement: { x: 28, y: 21 }
    properties:
      text: "Village storehouse. Lost the key? The Thornwood goblins took it, along with half our arrows. A deft hand or a strong shoulder might manage the lock."
  - type: iron_chest
    placement: { x: 26, y: 18 }
    contents:
      - type: flower_mana_potion_recipe
      - type: swiftness_scroll
      - type: magic_dart_scroll
      - type: lesser_heal_scroll
      - type: leather_helmet
      - type: potion
        quantity: 2
      - type: gold_coin
        quantity: 8
  - type: crate
    placement: { x: 29, y: 19 }
    contents:
      - type: arrow
        quantity: 20
  - type: barrel
    placement: { x: 25, y: 17 }
    contents:
      - type: berries
        quantity: 6

  # -- village green: campfire = crafting station + stamina rest ------------------
  - type: campfire
    placement: { x: 24, y: 29 }
  - type: bench
    placement: { x: 23, y: 29 }
    facing: east
  - type: bench
    placement: { x: 25, y: 29 }
    facing: west

  # -- villagers -------------------------------------------------------------------
  # Stallkeeper: minds the market stall by day, sleeps in the tavern at night.
  - type: townsfolk
    placement: { x: 32, y: 26 }
    routine:
      schedule:
        - { from: 0.27, to: 0.75, activity: work, at: { x: 32, y: 27 }, face: west }
        - { from: 0.80, to: 0.22, activity: sleep, at: { x: 40, y: 30 }, face: west }
  # Road warden: walks the whole main road, bridge to arch.
  - type: townsfolk
    placement: { x: 29, y: 25 }
    routine:
      patrol:
        mode: ping_pong
        waypoints:
          - { x: 22, y: 25, dwell: 3.0 }
          - { x: 46, y: 25, dwell: 3.0 }
  # Gossip pair by the well (ambient chatter demo).
  - type: townsfolk
    placement: { x: 33, y: 22 }
    behavior:
      kind: roam
      step_interval_seconds: 1.6
      bounds: { min_x: 31, min_y: 21, max_x: 36, max_y: 24 }
  - type: townsfolk
    placement: { x: 34, y: 22 }
    behavior:
      kind: roam
      step_interval_seconds: 1.8
      bounds: { min_x: 31, min_y: 21, max_x: 36, max_y: 24 }

  # -- the Grey Ledger (traveling assessor's office, east edge of the plaza) ----
  # Yarn-only quest-journal test NPCs from assets/modules/grey_ledger/.
  # Removing that module leaves these two type refs dangling — drop this block
  # with it.
  - type: sign_post
    placement: { x: 38, y: 22 }
    properties:
      text: "THE GREY LEDGER - registrations, censuses, seals. Queue orderly. Do not touch the bell."
  - type: table                   # Quill's folding desk
    placement: { x: 39, y: 23 }
  - type: grey_ledger/assessor_quill
    placement: { x: 39, y: 24 }
  - type: crate                   # Moss's rampart of paper
    placement: { x: 41, y: 23 }
  - type: book
    placement: { x: 41, y: 22 }
  - type: grey_ledger/underclerk_moss
    placement: { x: 41, y: 24 }

  # -- proving grounds arch ----------------------------------------------------------
  - type: portal_arch
    placement: { x: 47, y: 25 }
  - type: sign_post
    placement: { x: 48, y: 26 }
    properties:
      text: "The Proving Grounds. A training hall where nothing is quite real: climbing, jumping, levers, plates, sneaking, hidden things. Step through the arch."

  # ==== EMBERBROOK FIELDS (west, L1) ==============================================
  - type: sign_post
    placement: { x: 22, y: 27 }
    properties:
      text: "Ember Bridge. Beyond: the orchard and flower fields. Rats gnaw the south paddocks - the shopkeeper pays for culling them."
  - type: apple                   # windfall apples under the orchard trees
    placement:
      - { x: 7, y: 28 }
      - { x: 9, y: 28 }
      - { x: 10, y: 30 }
      - { x: 13, y: 30 }
  - type: herb_patch
    placement:
      - { x: 8, y: 33 }
      - { x: 12, y: 16 }
  - type: fishing_spot
    placement:
      - { x: 18, y: 31 }
      - { x: 20, y: 17 }
      - { x: 19, y: 7 }

  # ==== THORNWOOD (north, L2-3) ====================================================
  - type: sign_post
    placement: { x: 33, y: 40 }
    properties:
      text: "Thornwood. Goblins hold the deep woods - travel armed. Their camp lies northeast; something big dens in the northwest. Do not go northwest."
  - type: herb_patch
    placement:
      - { x: 24, y: 36 }
      - { x: 53, y: 37 }

  # -- goblin camp (NE): the stolen key, hidden traps, ranged + caster foes -------
  - type: sign_post
    placement: { x: 56, y: 39 }
    properties:
      text: "GO AWAY. no humans. no wardens. no refunds. - the Thornwood boys"
  - type: bear_trap
    placement: { x: 54, y: 38 }
    properties:
      hidden_dc: "13"
  - type: bear_trap
    placement: { x: 56, y: 42 }
    properties:
      hidden_dc: "13"
  - type: bear_trap
    placement: { x: 51, y: 44 }
    properties:
      hidden_dc: "13"
  - type: campfire
    placement: { x: 55, y: 43 }
  - type: barrel
    placement: { x: 51, y: 45 }
    contents:
      - type: potion
  - type: crate
    placement: { x: 58, y: 44 }
    contents:
      - type: arrow
        quantity: 15
      - type: apple
        quantity: 2
  - type: iron_chest              # the storehouse key ended up here
    placement: { x: 60, y: 45 }
    contents:
      - type: iron_key
      - type: spark_bolt_scroll
      - type: silver_coin
        quantity: 12

  # -- ogre den (NW, L10 elite) ------------------------------------------------------
  - type: crate
    placement: { x: 5, y: 45 }
    contents:
      - type: empower_weapon_scroll
      - type: potion
        quantity: 2
      - type: gold_coin
        quantity: 15

  # ==== THE OLD YARD (south, L3) =====================================================
  - type: sign_post
    placement: { x: 34, y: 11 }
    properties:
      text: "The Old Yard. Respect the dead; they do not always return the courtesy. The crypt gate is weighted shut."
  # Hidden cache among the graves — Aware mode (F) to spot it.
  - type: iron_chest
    placement: { x: 25, y: 3 }
    properties:
      hidden_dc: "14"
    contents:
      - type: wand_of_sparks
      - type: cure_wounds_scroll
      - type: silver_coin
        quantity: 10

  # -- the crypt: pressure-plate puzzle + guardian --------------------------------
  - id: crypt_gate
    type: wooden_door_n
    placement: { x: 38, y: 7 }
  - type: pressure_plate
    placement: { x: 38, y: 9 }
    properties:
      target: crypt_gate
  - type: barrel                  # push it onto the plate to hold the gate open
    placement: { x: 39, y: 9 }
  - type: sign_post
    placement: { x: 40, y: 9 }
    properties:
      text: "The gate answers weight, not prayer."
  - type: torch
    placement: { x: 37, y: 6 }
  - type: tombstone
    placement: { x: 37, y: 5 }
    properties:
      title: "Aldric Ember"
      text: "Founder of Emberbrook. His plate and shield went below with the wight that slew him. The key to the vault never left goblin hands."
  - type: iron_chest
    placement: { x: 39, y: 4 }
    contents:
      - type: chain_legs
      - type: bless_scroll
      - type: gold_coin
        quantity: 6
  - type: skeleton                # crypt guardian (does not respawn)
    placement: { x: 39, y: 5 }
    behavior:
      kind: roam_and_chase
      step_interval_seconds: 0.8
      detect_distance_tiles: 3
      disengage_distance_tiles: 5
      bounds: { min_x: 37, min_y: 4, max_x: 40, max_y: 6 }

  # ==== CINDER HILLS (east, L6-8) ======================================================
  - type: sign_post
    placement: { x: 51, y: 26 }
    properties:
      text: "The Cinder Hills. Ore veins aplenty - and things that burn and bite. Turn back if unseasoned."
  - type: ore_node
    placement:
      - { x: 56, y: 14 }
      - { x: 60, y: 18 }
      - { x: 50, y: 26 }
  - type: pickaxe                 # a prospector's abandoned pick
    placement: { x: 59, y: 18 }

  # -- sinkhole to the underworld ---------------------------------------------------
  - type: sign_post
    placement: { x: 57, y: 17 }
    properties:
      text: "A sinkhole breathes cold air. The founder's plate lies below, they say, hoarded by the wight that took him."

  # -- fire elemental glade (L6) ------------------------------------------------------
  - type: arcane_mote
    placement:
      - { x: 55, y: 30 }
      - { x: 59, y: 26 }
  - type: iron_chest
    placement: { x: 58, y: 28 }
    contents:
      - type: flame_weapon_scroll
      - type: fireball_scroll
      - type: gold_coin
        quantity: 10

  # -- cyclops lair (SE, L8) -------------------------------------------------------------
  - type: iron_chest
    placement: { x: 63, y: 4 }
    contents:
      - type: steel_sword
      - type: gold_coin
        quantity: 30

  # ==== HOLLOW BELL APPROACH (SW moor road) ==============================================
  # Trailhead dressing around the `hollow_bell_entrance` portal at (6,45).
  - type: portal_arch
    placement: { x: 6, y: 45 }
  - type: campfire
    placement: { x: 8, y: 47 }
  - type: stone
    placement: { x: 8, y: 44 }
  - type: stone
    placement: { x: 4, y: 46 }
  - type: sign_post
    placement: { x: 5, y: 44 }
    properties:
      text: "ASHEN HOLLOW half a mile — the bell-bronze delve. NOTICE: the mine is closed and the shifts are not coming up. Pit-captain Coalbright will speak to anyone who can hold a lamp and is not a fool."
  - type: sign_post
    placement: { x: 7, y: 46 }
    properties:
      text: "Three weeks now, and the bell has not rung once. My grandmother would have known what that meant. — scratched below the notice, in a shaky hand"

spawn_groups:
  # L1 — the hunter quest's rats, south paddocks of the fields.
  - id: field_rats
    template: rat
    max_count: 4
    respawn_mean_seconds: 45.0
    area:
      bounds: { min_x: 4, min_y: 6, max_x: 16, max_y: 18 }
    behavior:
      kind: roam_and_chase
      step_interval_seconds: 0.55
      detect_distance_tiles: 4
      disengage_distance_tiles: 6
      bounds: { min_x: 3, min_y: 5, max_x: 17, max_y: 19 }

  # L2 — goblin watch roaming the mid-forest.
  - id: thornwood_goblins
    template: goblin
    max_count: 3
    respawn_mean_seconds: 90.0
    area:
