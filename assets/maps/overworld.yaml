# ============================================================================
# EMBERBROOK — the showcase overworld.
#
# One coherent valley, difficulty radiating outward from a safe village at the
# map center (new players spawn at the geometric center (35,25) — the plaza).
#
#   Center  Emberbrook Village   safe zone: shop, tavern, quests, crafting
#   West    Emberbrook Fields    L1  rats (the villager's hunter quest)
#   North   Thornwood            L2-3 goblin watch; NE goblin camp (archer,
#                                mage, hidden bear traps, the stolen key)
#   NW      Ogre den             L10 elite guarding an off-limits clearing
#   South   The Old Yard         L3  skeleton cemetery + plate-puzzle crypt
#   East    Cinder Hills         L6 fire elemental glade, L8 cyclops lair,
#                                ore veins, sinkhole down to the underworld
#   Below   Underworld           L3 -> L12 dire-wight vault (end-game loot)
#
# NOTE ON THE GRID: text row 0 of `tiles:` is world y=0 = the SOUTH edge
# (Bevy +y = north), so this file reads "upside down" — the last line is the
# northern forest. Keep every row exactly 70 chars.
# ============================================================================
authored_id: overworld
permanence: persistent
width: 70
height: 50
fill_floor_type: grass

# Lighting: hand-tuned day/night curve (overrides the engine default).
# The curve is a full-screen tint: `alpha` is how strongly `color` is applied,
# so alpha 0 = untinted daylight and alpha ~1 = near-black night. Dawn breaks
# between 0.18 and 0.21, dusk falls between 0.80 and 0.82.
lighting:
  outdoor_ambient: [220, 220, 230]
  indoor_ambient: [55, 50, 60]
  has_day_night: true
  outdoor_curve:
    - { time: 0.00, color: [1, 1, 1],       alpha: 0.98 }   # deep night
    - { time: 0.18, color: [2, 2, 2],       alpha: 0.94 }   # pre-dawn
    - { time: 0.21, color: [11, 9, 9],      alpha: 0.0 }    # sunrise
    - { time: 0.80, color: [255, 255, 255], alpha: 0.0 }    # daylight
    - { time: 0.82, color: [1, 1, 1],       alpha: 0.99 }   # nightfall

legend:
  "P": pine_tree
  "T": oak_tree
  "W": water
  "f": fence
  "h": hedge
  "o": stone
  "#": cave_wall
  "*": crystal_cluster
  ",": flowers
  "B": berry_bush
  "x": tombstone
  "S": wall_s
  "N": wall_n
  "E": wall_e
  "V": wall_w
  "a": wall_corner_sw
  "b": wall_corner_se
  "c": wall_corner_nw
  "d": wall_corner_ne

