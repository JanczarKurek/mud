extends: npc
name: Goblin
tags: [humanoid, greenskin, monster]
description: A wiry green nuisance with a mean stare and quick hands.
level: 2
loot:
  corpse_despawn_seconds: 60
  drops:
    - type_id: apple
      quantity: 1
      probability: 0.5
stats:
  strength: 8
  agility: 11
  constitution: 8
  willpower: 6
  charisma: 4
  focus: 7
# Creature template: dice + flat, sized to the level budget (~mean 2+1.1·L).
damage: "1d6+1"
attack_profile:
  kind: melee
  damage_type: cut
# HP budget: mean ≈ 20 + 10·L.
hp: "1d6+20+constitution*2"
npc_behavior:
  step_interval_seconds: 0.9
  detect_distance_tiles: 5
  disengage_distance_tiles: 8
barks:
  aggro:
    - "Grraah!"
    - "Skin and bones!"
    - "Stab! Stab!"
  mutter:
    - "*grumbles*"
    - "Hungry..."
    - "Where shiny things?"
render:
  debug_color:
  - 92
  - 156
  - 68
  debug_size: 0.92
  sprite_path: overworld_objects/goblin/sprite.png
  y_sort: true
  logical_height_tiles: 0.9
  animation:
    sheet_path: overworld_objects/goblin/sheet.png
    frame_width: 96
    frame_height: 96
    sheet_columns: 4
    sheet_rows: 8
    clips:
      idle_s: { row: 0, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_s: { row: 1, start_col: 0, frame_count: 4, fps: 16.0, looping: true }
      idle_n: { row: 2, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_n: { row: 3, start_col: 0, frame_count: 4, fps: 16.0, looping: true }
      idle_e: { row: 4, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_e: { row: 5, start_col: 0, frame_count: 4, fps: 16.0, looping: true }
      idle_w: { row: 6, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_w: { row: 7, start_col: 0, frame_count: 4, fps: 16.0, looping: true }
