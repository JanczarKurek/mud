extends: npc
name: Villager
description: Just a wandering villager — also dabbles in trade.
dialog_node: FriendlyVillager
shopkeeper:
  wares:
    - type_id: apple
      price_copper: 4
      stock: infinite
    - type_id: bronze_sword
      price_copper: 720          # 3 gold
      stock: 2
    - type_id: leather_armor
      price_copper: 1200         # 5 gold
      stock: 1
    # Mid-tier gear (the ~L4-10 upgrade path; the top tier — steel/plate/tower —
    # drops from the ogre brute and dire wight instead).
    - type_id: iron_sword
      price_copper: 2400         # 10 gold
      stock: 1
    - type_id: dagger
      price_copper: 480          # 2 gold
      stock: 2
    - type_id: longbow
      price_copper: 1900
      stock: 1
    - type_id: chain_helmet
      price_copper: 1400
      stock: 1
    - type_id: chain_armor
      price_copper: 2600
      stock: 1
    - type_id: chain_legs
      price_copper: 1700
      stock: 1
    # Crafting tools — also serve as the buy-price reference for gathering drops.
    - type_id: fishing_rod
      price_copper: 120
      stock: infinite
    - type_id: pickaxe
      price_copper: 200
      stock: infinite
    - type_id: herb_knife
      price_copper: 60
      stock: infinite
    # Gathering drops — listed so the villager will buy them from the player.
    - type_id: raw_fish
      price_copper: 8
      stock: infinite
    - type_id: green_herb
      price_copper: 12
      stock: infinite
    - type_id: iron_ore
      price_copper: 20
      stock: infinite
render:
  sprite_path: overworld_objects/villager/sprite.png
  y_sort: true
  logical_height_tiles: 1.2
  animation:
    sheet_path: overworld_objects/villager/sheet.png
    frame_width: 96
    frame_height: 96
    sheet_columns: 4
    sheet_rows: 8
    clips:
      idle_s: { row: 0, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_s: { row: 1, start_col: 0, frame_count: 4, fps: 10.0, looping: true }
      idle_n: { row: 2, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_n: { row: 3, start_col: 0, frame_count: 4, fps: 10.0, looping: true }
      idle_e: { row: 4, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_e: { row: 5, start_col: 0, frame_count: 4, fps: 10.0, looping: true }
      idle_w: { row: 6, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_w: { row: 7, start_col: 0, frame_count: 4, fps: 10.0, looping: true }
