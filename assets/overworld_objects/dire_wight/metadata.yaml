extends: npc
name: Dire Wight
tags: [undead, monster]
description: A gaunt revenant wrapped in grave-cold air. Frost creeps across the ground where it walks.
lore: >-
  The cold around a wight is not weather but appetite — it draws the warmth out of a room the way a drain takes water.
level: 12
stats:
  strength: 14
  agility: 14
  constitution: 14
  willpower: 16
  charisma: 6
  focus: 12
# Creature template: dice + flat, sized to the level budget (~mean 2+1.3·L).
damage: "2d10+7"
attack_profile:
  kind: melee
  damage_type: death
  on_hit_effects:
    - kind: chill
      chance: 0.3
      magnitude: 2.0
      seconds: 5.0
      secondary_magnitude: 1.5
# HP budget: mean ≈ 20 + 11·L.
hp: "3d12+60+constitution*5"
armor: 3
# The endgame hoard. Same trim as the ogre: top-tier gear stays rare per
# kill rather than near-certain.
loot:
  corpse_despawn_seconds: 90
  drops:
    - type_id: gold_coin
      quantity: "uniform(1, 3)"
      probability: 1.0
    - type_id: silver_coin
      quantity: "uniform(5, 15)"
      probability: 1.0
    - type_id: grave_ring
      quantity: 1
      probability: 0.3
    - type_id: amber_lump
      quantity: 1
      probability: 0.2
    - type_id: steel_sword
      quantity: 1
      probability: 0.1
    - type_id: plate_armor
      quantity: 1
      probability: 0.1
    - type_id: tower_shield
      quantity: 1
      probability: 0.1
npc_behavior:
  step_interval_seconds: 1.0
  detect_distance_tiles: 6
  disengage_distance_tiles: 10
barks:
  aggro:
    - "*a rattling exhale*"
    - "Cold... take you..."
  mutter:
    - "*frost crackles*"
    - "*hollow whisper*"
render:
  debug_color: [180, 200, 215]
  debug_size: 0.95
  sprite_path: overworld_objects/dire_wight/sprite.png
  y_sort: true
  logical_height_tiles: 1.15
  animation:
    sheet_path: overworld_objects/dire_wight/sheet.png
    frame_width: 96
    frame_height: 96
    sheet_columns: 4
    sheet_rows: 8
    clips:
      idle_s: { row: 0, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_s: { row: 1, start_col: 0, frame_count: 4, fps: 8.0, looping: true }
      idle_n: { row: 2, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_n: { row: 3, start_col: 0, frame_count: 4, fps: 8.0, looping: true }
      idle_e: { row: 4, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_e: { row: 5, start_col: 0, frame_count: 4, fps: 8.0, looping: true }
      idle_w: { row: 6, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_w: { row: 7, start_col: 0, frame_count: 4, fps: 8.0, looping: true }
