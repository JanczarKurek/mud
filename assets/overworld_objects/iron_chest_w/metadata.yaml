extends: movable_obstacle
name: Iron Chest (West)
description: A heavy iron-banded chest. Its lock faces west, away from view.
container_capacity: 12
colliding: true
render:
  z_index: 0.25
  debug_color: [120, 120, 130]
  debug_size: 0.78
  sprite_path: overworld_objects/iron_chest_w/closed.png
  sprite_width_tiles: 2.125
  sprite_height_tiles: 1.375
  block_size: 1
  walkable_surface: true
  stack_order: 20
states:
  locked:
    sprite_path: overworld_objects/iron_chest_w/closed.png
  closed:
    sprite_path: overworld_objects/iron_chest_w/closed.png
  open:
    sprite_path: overworld_objects/iron_chest_w/open.png
initial_state: closed
lock:
  lock_id: 7
  pick_dc: 12
  force_dc: 20
interactions:
  - verb: pick_lock
    label: Pick Lock
    from: [locked]
    to: closed
    skill_gate:
      skill: Thievery
      dc: from_lock_pick
  - verb: force_lock
    label: Force Lock
    from: [locked]
    to: closed
    skill_gate:
      skill: Athletics
      dc: from_lock_force
  - verb: use_key
    label: Use Key
    from: [locked]
    to: closed
    key_gate:
      source: from_lock
