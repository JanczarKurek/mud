extends: npc
name: Skeleton
tags: [undead, monster]
description: A reanimated skeleton, its empty eye sockets flickering with a sickly green glow.
level: 3
stats:
  strength: 7
  agility: 8
  constitution: 6
  willpower: 5
  charisma: 2
  focus: 6
# Creature template: dice + flat, sized to the level budget (~mean 2+1.3·L).
damage: "1d8+2"
attack_profile:
  kind: melee
  damage_type: cut
hp: "1d8+30+constitution*3"
armor: 1
block: 2
block_chance: 15
npc_behavior:
  step_interval_seconds: 0.9
  detect_distance_tiles: 5
  disengage_distance_tiles: 8
barks:
  aggro:
    - "*rattle*"
    - "Join us..."
    - "*hollow clatter*"
  mutter:
    - "*creaks*"
    - "*bones grinding*"
render:
  debug_color: [218, 210, 185]
  debug_size: 0.88
  sprite_path: overworld_objects/skeleton/sprite.png
  y_sort: true
  logical_height_tiles: 1.15
  animation:
    sheet_path: overworld_objects/skeleton/sheet.png
    frame_width: 96
    frame_height: 96
    sheet_columns: 4
    sheet_rows: 8
    clips:
      idle_s: { row: 0, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_s: { row: 1, start_col: 0, frame_count: 4, fps: 8.0, looping: true }
      idle_n: { row: 2, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_n: { row: 3, start_col: 0, frame_count: 4, fps: 8.0, looping: true }
      idle_e: { row: 4, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_e: { row: 5, start_col: 0, frame_count: 4, fps: 8.0, looping: true }
      idle_w: { row: 6, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_w: { row: 7, start_col: 0, frame_count: 4, fps: 8.0, looping: true }
