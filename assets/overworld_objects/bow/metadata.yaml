extends: equipment
name: Shortbow
weight: 2.0
description: A sturdy shortbow strung with gut. Needs arrows in the ammo slot.
equipment_slot: weapon
attack_profile:
  kind: ranged
base_range_tiles: 5
ammo_type: arrow
# Bows key damage off the AGI ability modifier, matching their AGI-based
# to-hit, + the same level/2 growth as melee. The crossbow is the
# heavier-hitting sibling.
damage: "1d6+agi_mod+level/2"
stats:
  agility: 1
render:
  debug_color: [140, 95, 48]
  debug_size: 0.6
  sprite_path: overworld_objects/bow/sprite.png
