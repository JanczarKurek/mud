extends: npc
name: Summoned Wolf
description: A spectral wolf bound to its summoner's will, fierce but fleeting.
level: 2
# No loot block: a conjured creature leaves no corpse or drops when it falls.
stats:
  strength: 12
  agility: 14
  constitution: 10
  willpower: 6
  charisma: 6
  focus: 6
# Creature template: dice + flat, sized to the level budget (~mean 2+1.1·L).
damage: "1d6+1"
attack_profile:
  kind: melee
  damage_type: cut
hp: "2d8+constitution*2"
npc_behavior:
  step_interval_seconds: 0.6
  detect_distance_tiles: 6
  disengage_distance_tiles: 10
barks:
  aggro:
    - "*snarls*"
    - "*growls low*"
  mutter:
    - "*pads quietly*"
render:
  debug_color:
    - 122
    - 130
    - 150
  debug_size: 0.85
  sprite_path: overworld_objects/summoned_wolf/sprite.png
  y_sort: true
  animation:
    sheet_path: overworld_objects/summoned_wolf/sheet.png
    frame_width: 32
    frame_height: 48
    sheet_columns: 4
    sheet_rows: 2
    clips:
      idle:
        row: 0
        start_col: 0
        frame_count: 4
        fps: 3.0
        looping: true
      walk:
        row: 1
        start_col: 0
        frame_count: 4
        fps: 16.0
        looping: true
