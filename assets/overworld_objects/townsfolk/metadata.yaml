extends: npc
name: Townsfolk
tags: [humanoid, townsfolk]
factions: [emberbrook_town]
description: An ordinary villager going about their day.
# Peaceful: never chases. Roams gently between routine goals when idle.
npc_behavior:
  hostile: false
  step_interval_seconds: 0.7
  idle_pause_chance: 0.35
  momentum_bias: 0.6
  detect_distance_tiles: 4
  disengage_distance_tiles: 6

# Named activity library referenced by a map instance's `routine:` schedule.
# `pose_state` names a `states:` key below; while dwelling, the NPC adopts that
# ObjectState (and its animation, if the state declares one — these reuse the
# base sprite until pose sheets are authored with the gen-sprite skill).
activities:
  work:
    pose_state: working
    dwell: { min: 4.0, max: 9.0 }
    barks: ["*tap tap tap*", "Honest day's work.", "*hums a tune*"]
  sleep:
    pose_state: sleeping
    dwell: { min: 8.0, max: 16.0 }
    barks: ["*snoring*", "zzz..."]

# Ambient/social chatter: two townsfolk standing near each other trade lines.
chatter:
  radius_tiles: 3
  greetings: ["Morning.", "Well met, neighbour.", "Fine day."]
  topics:
    - ["Cold morning, eh?", "Aye, frost on the well again.", "Winter's early this year."]
    - ["Heard about the goblins?", "Don't remind me.", "The guard'll handle it... I hope."]
    - ["Market's dear lately.", "Everything's copper this, copper that.", "Times are hard."]

# Pose states. Each carries its own animation sheet (generated by
# scripts/gen_townsfolk_sheets.py); the routine swaps the NPC's ObjectState to
# these while it dwells at a station, and the client plays the matching sheet.
states:
  working:
    animation:
      sheet_path: overworld_objects/townsfolk/work.png
      frame_width: 96
      frame_height: 96
      sheet_columns: 4
      sheet_rows: 1
      clips:
        idle: { row: 0, start_col: 0, frame_count: 4, fps: 6.0, looping: true }
  sleeping:
    animation:
      sheet_path: overworld_objects/townsfolk/sleep.png
      frame_width: 96
      frame_height: 96
      sheet_columns: 2
      sheet_rows: 1
      clips:
        idle: { row: 0, start_col: 0, frame_count: 2, fps: 1.5, looping: true }

render:
  sprite_path: overworld_objects/townsfolk/sprite.png
  y_sort: true
  logical_height_tiles: 1.2
  animation:
    sheet_path: overworld_objects/townsfolk/sheet.png
    frame_width: 96
    frame_height: 96
    sheet_columns: 4
    sheet_rows: 8
    clips:
      idle_s: { row: 0, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_s: { row: 1, start_col: 0, frame_count: 4, fps: 10.0, looping: true }
      idle_n: { row: 2, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_n: { row: 3, start_col: 0, frame_count: 4, fps: 10.0, looping: true }
      idle_e: { row: 4, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_e: { row: 5, start_col: 0, frame_count: 4, fps: 10.0, looping: true }
      idle_w: { row: 6, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_w: { row: 7, start_col: 0, frame_count: 4, fps: 10.0, looping: true }
