extends: npc
name: Town Guard
tags: [humanoid, guard]
description: A watchful guard in town livery, hand never far from the hilt.
level: 4
faction: player_side
# Two allegiances: the Watch itself, and the town it protects. Membership in
# `emberbrook_town` is what makes a guard take a murdered villager (or a
# slaughtered sheep) personally.
factions: [emberbrook_watch, emberbrook_town]
# Active duty: a guard that *sees* an attack on a member of these factions
# attacks the aggressor immediately (and shouts an alarm bark), regardless of
# how much guilt the attacker has accrued.
protects_factions: [emberbrook_watch, emberbrook_town]
hostile_towards: [monster, undead]
stats:
  strength: 13
  agility: 11
  constitution: 13
  willpower: 10
  charisma: 9
  focus: 8
# Creature template: dice + flat, sized to the level budget (~mean 2+1.1·L).
damage: "1d8+3"
attack_profile:
  kind: melee
  damage_type: cut
# HP budget: mean ≈ 20 + 10·L.
hp: "1d8+30+constitution*2"
armor: 2
npc_behavior:
  step_interval_seconds: 0.8
  detect_distance_tiles: 7
  disengage_distance_tiles: 10
  perception: 3
barks:
  aggro:
    - "Halt, fiend!"
    - "To arms!"
    - "Not in my town!"
  mutter:
    - "All quiet."
    - "Long shift..."
    - "*scans the treeline*"
  alarm:
    - "Stop! Criminal!"
    - "You there! Drop your weapon!"
    - "To arms! Assault in the streets!"
render:
  debug_color:
  - 120
  - 130
  - 160
  debug_size: 0.95
  sprite_path: overworld_objects/town_guard/sprite.png
  y_sort: true
  logical_height_tiles: 1.2
  animation:
    sheet_path: overworld_objects/town_guard/sheet.png
    frame_width: 128
    frame_height: 96
    sheet_columns: 4
    sheet_rows: 8
    clips:
      idle_s: { row: 0, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_s: { row: 1, start_col: 0, frame_count: 4, fps: 10.0, looping: true }
      idle_n: { row: 2, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_n: { row: 3, start_col: 0, frame_count: 4, fps: 10.0, looping: true }
      idle_e: { row: 4, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_e: { row: 5, start_col: 0, frame_count: 4, fps: 10.0, looping: true }
      idle_w: { row: 6, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_w: { row: 7, start_col: 0, frame_count: 4, fps: 10.0, looping: true }
