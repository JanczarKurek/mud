extends: equipment
name: Bronze Sword
weight: 2.0
value_copper: 720
description: "A simple bronze sword with a broad beginner blade. {properties.inscription_line|}"
equipment_slot: weapon
engravable: true
# Starter martial template: dice + STR ability modifier (matches to-hit math)
# + a level/2 skill-growth term shared by all real melee weapons. Tiers above
# it (iron/steel) grow the dice + flat bonus.
damage: "1d8+str_mod+level/2"
attack_profile:
  kind: melee
  damage_type: cut
render:
  debug_color: [176, 118, 58]
  debug_size: 0.55
  sprite_path: overworld_objects/bronze_sword/sprite.png
