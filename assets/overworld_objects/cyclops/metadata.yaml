extends: npc
name: Cyclops
tags: [humanoid, giant, monster]
description: A hulking one-eyed giant with a massive club and a short temper.
lore: >-
  One eye means no depth perception, which is why a cyclops swings wide and often. Get inside the arc and it is nearly harmless; stay outside it and you are nearly dead.
level: 8
# Brute: full BAB track so it stays accurate at its level (most creatures use
# the default ¾ track). Its to-hit is now bab_at(full, 8) + STR_mod, not raw +8.
bab_track: full
stats:
  strength: 18
  agility: 5
  constitution: 16
  willpower: 7
  charisma: 4
  focus: 7
# Creature template: dice + flat, sized to the level budget (~mean 2+1.3·L).
# Swingy brute dice fit the club.
damage: "2d8+3"
# HP budget: mean ≈ 20 + 11·L, tanky ×1.4 (it's the zone boss).
hp: "2d20+50+constitution*5"
loot:
  corpse_despawn_seconds: 90
  drops:
    - type_id: silver_coin
      quantity: "uniform(8, 20)"
      probability: 0.9   # taken off travellers
    - type_id: giant_tooth
      quantity: 1
      probability: 0.6
    - type_id: dried_meat
      quantity: "uniform(1, 3)"
      probability: 0.4
    - type_id: amber_lump
      quantity: 1
      probability: 0.2
    - type_id: tower_shield
      quantity: 1
      probability: 0.06
npc_behavior:
  step_interval_seconds: 1.4
  detect_distance_tiles: 5
  disengage_distance_tiles: 8
render:
  debug_color: [110, 130, 75]
  debug_size: 1.4
  sprite_path: overworld_objects/cyclops/sprite.png
  y_sort: true
  logical_height_tiles: 1.7
  animation:
    sheet_path: overworld_objects/cyclops/sheet.png
    frame_width: 136
    frame_height: 112
    sheet_columns: 4
    sheet_rows: 8
    clips:
      idle_s: { row: 0, start_col: 0, frame_count: 4, fps: 2.0, looping: true }
      walk_s: { row: 1, start_col: 0, frame_count: 4, fps: 6.0, looping: true }
      idle_n: { row: 2, start_col: 0, frame_count: 4, fps: 2.0, looping: true }
      walk_n: { row: 3, start_col: 0, frame_count: 4, fps: 6.0, looping: true }
      idle_e: { row: 4, start_col: 0, frame_count: 4, fps: 2.0, looping: true }
      walk_e: { row: 5, start_col: 0, frame_count: 4, fps: 6.0, looping: true }
      idle_w: { row: 6, start_col: 0, frame_count: 4, fps: 2.0, looping: true }
      walk_w: { row: 7, start_col: 0, frame_count: 4, fps: 6.0, looping: true }
