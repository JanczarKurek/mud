extends: npc
name: Cyclops
description: A hulking one-eyed giant with a massive club and a short temper.
level: 8
# Brute: full BAB track so it stays accurate at its level (most creatures use
# the default ¾ track). Its to-hit is now bab_at(full, 8) + STR_mod, not raw +8.
bab_track: full
stats:
  strength: 18
  agility: 5
  constitution: 16
  willpower: 7
  charisma: 4
  focus: 7
# Creature template: dice + flat, sized to the level budget (~mean 2+1.3·L).
# Swingy brute dice fit the club.
damage: "2d8+3"
# HP budget: mean ≈ 20 + 11·L, tanky ×1.4 (it's the zone boss).
hp: "2d20+50+constitution*5"
npc_behavior:
  step_interval_seconds: 1.4
  detect_distance_tiles: 5
  disengage_distance_tiles: 8
render:
  debug_color: [110, 130, 75]
  debug_size: 1.4
  sprite_path: overworld_objects/cyclops/sprite.png
  y_sort: true
  animation:
    sheet_path: overworld_objects/cyclops/sheet.png
    frame_width: 64
    frame_height: 80
    sheet_columns: 4
    sheet_rows: 2
    clips:
      idle:
        row: 0
        start_col: 0
        frame_count: 4
        fps: 2.0
        looping: true
      walk:
        row: 1
        start_col: 0
        frame_count: 4
        fps: 6.0
        looping: true
