extends: npc
name: Ogre Brute
tags: [humanoid, giant, monster]
description: A slab-shouldered ogre dragging a tree-trunk club. It smells you before it sees you.
lore: >-
  Ogres claim territory by smell and defend it by weight. The tree-trunk clubs are not weapons so much as furniture they refuse to put down.
level: 10
# Brute: full BAB track — accurate for its level, like the Cyclops.
bab_track: full
stats:
  strength: 19
  agility: 6
  constitution: 17
  willpower: 7
  charisma: 3
  focus: 5
# Creature template: dice + flat, sized to the level budget (~mean 2+1.3·L).
damage: "2d8+6"
attack_profile:
  kind: melee
  damage_type: blunt
# HP budget: mean ≈ 20 + 11·L, tanky ×1.4.
hp: "2d20+75+constitution*5"
armor: 2
loot:
  corpse_despawn_seconds: 60
  drops:
    - type_id: gold_coin
      quantity: "uniform(2, 5)"
      probability: 1.0
    - type_id: chain_armor
      quantity: 1
      probability: 0.25
    - type_id: chain_helmet
      quantity: 1
      probability: 0.2
    - type_id: chain_legs
      quantity: 1
      probability: 0.2
    - type_id: iron_sword
      quantity: 1
      probability: 0.15
npc_behavior:
  step_interval_seconds: 1.3
  detect_distance_tiles: 5
  disengage_distance_tiles: 9
barks:
  aggro:
    - "SMASH!"
    - "*bellows*"
    - "Little meat!"
  mutter:
    - "*scratches belly*"
    - "*gnaws a bone*"
render:
  debug_color: [140, 120, 80]
  debug_size: 1.2
  sprite_path: overworld_objects/ogre_brute/sprite.png
  y_sort: true
  logical_height_tiles: 1.7
  animation:
    sheet_path: overworld_objects/ogre_brute/sheet.png
    frame_width: 136
    frame_height: 112
    sheet_columns: 4
    sheet_rows: 8
    clips:
      idle_s: { row: 0, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_s: { row: 1, start_col: 0, frame_count: 4, fps: 8.0, looping: true }
      idle_n: { row: 2, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_n: { row: 3, start_col: 0, frame_count: 4, fps: 8.0, looping: true }
      idle_e: { row: 4, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_e: { row: 5, start_col: 0, frame_count: 4, fps: 8.0, looping: true }
      idle_w: { row: 6, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_w: { row: 7, start_col: 0, frame_count: 4, fps: 8.0, looping: true }
