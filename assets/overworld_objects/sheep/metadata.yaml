extends: npc
name: Sheep
tags: [beast, livestock]
# Somebody's property: rustling the flock is a crime the Watch answers for.
# (Wolves eat sheep freely — guilt is only ever charged to players.)
factions: [emberbrook_town]
description: A woolly grazer, blissfully unaware of anything but grass. Mostly.
lore: >-
  Emberbrook's flock is common property in practice and somebody's property in law, which is why the Watch takes a dead sheep personally.
level: 1
# Livestock: butchery yields, no coin. Killing one in sight of the town
# is still a crime — see the crime registry.
loot:
  corpse_despawn_seconds: 60
  drops:
    - type_id: sheep_wool
      quantity: "uniform(1, 2)"
      probability: 0.8
    - type_id: raw_hide
      quantity: 1
      probability: 0.5
    - type_id: dried_meat
      quantity: "uniform(1, 2)"
      probability: 0.3
stats:
  strength: 6
  agility: 8
  constitution: 9
  willpower: 4
  charisma: 6
  focus: 4
# No attack_profile / damage: sheep don't fight, they run.
# HP budget: mean ≈ 20 + 10·L.
hp: "1d6+18+constitution*2"
# Prey: bolts from anything tagged `predator` (wolves) on sight.
flees_from: [predator]
npc_behavior:
  step_interval_seconds: 1.2
  detect_distance_tiles: 6
  disengage_distance_tiles: 8
barks:
  mutter:
    - "Baa."
    - "Baaaa."
    - "*chews*"
render:
  debug_color:
    - 228
    - 224
    - 214
  debug_size: 0.8
  sprite_path: overworld_objects/sheep/sprite.png
  y_sort: true
  logical_height_tiles: 0.7
  animation:
    sheet_path: overworld_objects/sheep/sheet.png
    frame_width: 96
    frame_height: 64
    sheet_columns: 4
    sheet_rows: 8
    clips:
      idle_s: { row: 0, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_s: { row: 1, start_col: 0, frame_count: 4, fps: 12.0, looping: true }
      idle_n: { row: 2, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_n: { row: 3, start_col: 0, frame_count: 4, fps: 12.0, looping: true }
      idle_e: { row: 4, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_e: { row: 5, start_col: 0, frame_count: 4, fps: 12.0, looping: true }
      idle_w: { row: 6, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_w: { row: 7, start_col: 0, frame_count: 4, fps: 12.0, looping: true }
