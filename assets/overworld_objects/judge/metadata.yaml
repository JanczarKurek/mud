extends: npc
name: Magistrate
tags: [humanoid, townsfolk]
# A member of the town, so murdering the magistrate is itself a crime — but
# deliberately *not* of the Watch: they judge it, they don't serve in it.
factions: [emberbrook_town]
description: >-
  A grey-haired magistrate of the Emberbrook Watch, staff of office in hand.
  For the right price, they will strike your name from the ledger.
level: 3
# Clears guilt with both town bodies. The fee scales with the debt: a brawl
# (~40 points) runs about 1 gold, a murder (70) about 1g 1s.
judge:
  clears_factions: [emberbrook_watch, emberbrook_town]
  copper_per_guilt_point: 4
stats:
  strength: 9
  agility: 9
  constitution: 10
  willpower: 14
  charisma: 14
  focus: 12
hp: "1d8+20+constitution*2"
armor: 0
# Peaceful: stands their ground, never chases. No attack profile — a
# magistrate calls the Watch rather than drawing steel.
npc_behavior:
  hostile: false
  step_interval_seconds: 0.9
  idle_pause_chance: 0.6
  momentum_bias: 0.5
  detect_distance_tiles: 4
  disengage_distance_tiles: 6
barks:
  mutter:
    - "The ledger is never empty."
    - "Justice has a price. Everything does."
    - "*shuffles parchment*"
render:
  debug_color:
    - 60
    - 50
    - 70
  debug_size: 0.95
  sprite_path: overworld_objects/judge/sprite.png
  y_sort: true
  logical_height_tiles: 1.2
  animation:
    sheet_path: overworld_objects/judge/sheet.png
    frame_width: 96
    frame_height: 96
    sheet_columns: 4
    sheet_rows: 8
    clips:
      idle_s: { row: 0, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_s: { row: 1, start_col: 0, frame_count: 4, fps: 10.0, looping: true }
      idle_n: { row: 2, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_n: { row: 3, start_col: 0, frame_count: 4, fps: 10.0, looping: true }
      idle_e: { row: 4, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_e: { row: 5, start_col: 0, frame_count: 4, fps: 10.0, looping: true }
      idle_w: { row: 6, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_w: { row: 7, start_col: 0, frame_count: 4, fps: 10.0, looping: true }
