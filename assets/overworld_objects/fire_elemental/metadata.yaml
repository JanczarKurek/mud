extends: npc
name: Fire Elemental
tags: [elemental, monster]
description: A swirling vortex of living flame with a molten core. Heat rises from it in shimmering waves.
lore: >-
  It has no interest in you and no way to express that. Fire elementals simply continue in whatever direction they were last burning.
level: 6
# No coin: a being of living flame has no pockets and no use for money.
# Its worth is the slag it leaves behind.
loot:
  corpse_despawn_seconds: 45
  drops:
    - type_id: ember_shard
      quantity: "uniform(1, 2)"
      probability: 0.6
    - type_id: amber_lump
      quantity: 1
      probability: 0.15   # resin cooked out of whatever it burned through
stats:
  strength: 12
  agility: 13
  constitution: 12
  willpower: 14
  charisma: 6
  focus: 10
attack_profile:
  kind: melee
  damage_type: fire
  on_hit_effects:
    - kind: burning
      chance: 0.35
      magnitude: 2.0
      seconds: 6.0
# Creature template: dice + flat, sized to the level budget (~mean 2+1.3·L).
damage: "2d6+3"
# HP budget: mean ≈ 20 + 11·L.
hp: "2d10+40+constitution*3"
# Full-value armor retune (armor no longer halves): 2 -> 1 keeps the same
# effective mitigation.
armor: 1
npc_behavior:
  step_interval_seconds: 1.1
  detect_distance_tiles: 6
  disengage_distance_tiles: 10
render:
  debug_color: [232, 96, 32]
  debug_size: 1.15
  sprite_path: overworld_objects/fire_elemental/sprite.png
  y_sort: true
  logical_height_tiles: 1.6
  animation:
    sheet_path: overworld_objects/fire_elemental/sheet.png
    frame_width: 136
    frame_height: 112
    sheet_columns: 4
    sheet_rows: 8
    clips:
      idle_s: { row: 0, start_col: 0, frame_count: 4, fps: 4.0, looping: true }
      walk_s: { row: 1, start_col: 0, frame_count: 4, fps: 8.0, looping: true }
      idle_n: { row: 2, start_col: 0, frame_count: 4, fps: 4.0, looping: true }
      walk_n: { row: 3, start_col: 0, frame_count: 4, fps: 8.0, looping: true }
      idle_e: { row: 4, start_col: 0, frame_count: 4, fps: 4.0, looping: true }
      walk_e: { row: 5, start_col: 0, frame_count: 4, fps: 8.0, looping: true }
      idle_w: { row: 6, start_col: 0, frame_count: 4, fps: 4.0, looping: true }
      walk_w: { row: 7, start_col: 0, frame_count: 4, fps: 8.0, looping: true }
