extends: npc
name: Giant Rat
description: A mangy, oversized rodent with beady red eyes and a vicious bite.
level: 1
stats:
  strength: 5
  agility: 13
  constitution: 4
  willpower: 3
  charisma: 2
  focus: 5
# Creature template: dice + flat, sized to the level budget (~mean 2+1.1·L).
# The old expr keyed damage off AGI while melee to-hit uses STR — incoherent.
damage: "1d4+1"
attack_profile:
  kind: melee
  damage_type: pierce
hp: "1d4+10+constitution*2"
npc_behavior:
  step_interval_seconds: 0.5
  detect_distance_tiles: 4
  disengage_distance_tiles: 6
barks:
  aggro:
    - "*hiss*"
    - "*screech*"
    - "*chittering*"
  mutter:
    - "*sniff sniff*"
    - "*scratching*"
render:
  debug_color: [130, 105, 80]
  debug_size: 0.70
  sprite_path: overworld_objects/rat/sprite.png
  y_sort: true
  logical_height_tiles: 0.45
  animation:
    sheet_path: overworld_objects/rat/sheet.png
    frame_width: 96
    frame_height: 64
    sheet_columns: 4
    sheet_rows: 8
    clips:
      idle_s: { row: 0, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_s: { row: 1, start_col: 0, frame_count: 4, fps: 8.0, looping: true }
      idle_n: { row: 2, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_n: { row: 3, start_col: 0, frame_count: 4, fps: 8.0, looping: true }
      idle_e: { row: 4, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_e: { row: 5, start_col: 0, frame_count: 4, fps: 8.0, looping: true }
      idle_w: { row: 6, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_w: { row: 7, start_col: 0, frame_count: 4, fps: 8.0, looping: true }
