extends: npc
name: Archer Goblin
tags: [humanoid, greenskin, monster]
description: A wiry goblin wielding a crude shortbow. Keep your distance — that's exactly what it wants.
lore: >-
  The tribe's marksmen are simply the goblins too slight to hold a line. They compensate by never letting you close one.
level: 2
loot:
  corpse_despawn_seconds: 60
  drops:
    - type_id: arrow
      quantity: "uniform(3, 7)"
      probability: 1.0
    - type_id: copper_coin
      quantity: "uniform(1, 6)"
      probability: 0.7
    - type_id: goblin_ear
      quantity: 1
      probability: 0.5
    - type_id: forest_nuts
      quantity: 1
      probability: 0.25
    - type_id: bow
      quantity: 1
      probability: 0.06
stats:
  strength: 7
  agility: 13
  constitution: 7
  willpower: 6
  charisma: 4
  focus: 7
attack_profile:
  kind: ranged
base_range_tiles: 6
ammo_type: arrow
# Creature template: dice + flat, sized to the level budget (~mean 2+1.1·L).
damage: "1d6+1"
# HP budget: mean ≈ 20 + 10·L; ranged creatures run squishier.
hp: "1d8+15+constitution*2"
npc_behavior:
  step_interval_seconds: 1.0
  detect_distance_tiles: 8
  disengage_distance_tiles: 14
render:
  debug_color: [112, 176, 92]
  debug_size: 0.92
  sprite_path: overworld_objects/archer_goblin/sprite.png
  y_sort: true
  logical_height_tiles: 0.9
  animation:
    sheet_path: overworld_objects/archer_goblin/sheet.png
    frame_width: 96
    frame_height: 96
    sheet_columns: 4
    sheet_rows: 8
    clips:
      idle_s: { row: 0, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_s: { row: 1, start_col: 0, frame_count: 4, fps: 16.0, looping: true }
      idle_n: { row: 2, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_n: { row: 3, start_col: 0, frame_count: 4, fps: 16.0, looping: true }
      idle_e: { row: 4, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_e: { row: 5, start_col: 0, frame_count: 4, fps: 16.0, looping: true }
      idle_w: { row: 6, start_col: 0, frame_count: 4, fps: 3.0, looping: true }
      walk_w: { row: 7, start_col: 0, frame_count: 4, fps: 16.0, looping: true }
