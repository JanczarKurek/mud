[workspace]
members = [
    ".",
    "crates/bevy_terminal",
    "crates/mud2-lib",
    "crates/mud2-editor",
]
resolver = "2"

# The root package holds only the binaries (mud2, server, asset_viewer,
# floor_viewer, gen_schemas). The game library lives in crates/mud2-lib (lib
# target still named `mud2`), and the map editor + viewers in
# crates/mud2-editor — so editing editor code no longer rebuilds the game lib,
# the headless server never compiles editor code, and `cargo run --bin mud2`
# keeps working from the repo root.
[package]
name = "mud2-bins"
version = "0.2.0"
edition = "2021"

[lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "default_app",
    "default_platform",
    "2d_bevy_render",
    "ui_bevy_render",
] }
clap = { version = "4.5", features = ["derive", "env"] }
libc = "0.2"
mud2-lib = { path = "crates/mud2-lib", default-features = false }
mud2-editor = { path = "crates/mud2-editor", optional = true }
schemars = { version = "0.8", optional = true }

[features]
# Dev default: full game (simulation + editor) with bevy dynamic linking for
# fast `cargo run` iteration. Packaging scripts build `--no-default-features`,
# which drops all three — the shipped AppImage / Windows zip is the *thin
# client*: online-only (TcpClient mode), no embedded single-player, no editor,
# no sqlite/rustpython/yarnspinner in the binary (see packaging/*.sh).
# For an offline-capable package: `--no-default-features --features editor`.
default = ["dynamic_linking", "server-sim", "editor"]
dynamic_linking = ["mud2-lib/dynamic_linking"]
# Authoritative world simulation (embedded single-player + headless server).
server-sim = ["mud2-lib/server-sim"]
# In-game map editor + asset/floor viewers. Editing needs the live sim.
editor = ["dep:mud2-editor", "server-sim"]
gen-schemas = ["mud2-lib/gen-schemas", "schemars"]
dev-self-signed = ["mud2-lib/dev-self-signed"]
profiling = ["mud2-lib/profiling"]
tracy = ["mud2-lib/tracy"]
debug = ["mud2-lib/debug"]
# Spritesheet hot-reload for the asset_viewer binary.
viewer-hot-reload = ["editor", "mud2-editor?/viewer-hot-reload"]

[dev-dependencies]
serde = "1"
serde_json = "1"

[[bin]]
name = "mud2"
path = "src/main.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = ["server-sim"]

[[bin]]
name = "asset_viewer"
path = "src/bin/asset_viewer.rs"
required-features = ["editor"]

[[bin]]
name = "floor_viewer"
path = "src/bin/floor_viewer.rs"
required-features = ["editor"]

[[bin]]
name = "gen_schemas"
path = "src/bin/gen_schemas.rs"
required-features = ["gen-schemas"]

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
# Light optimization for our own code. Re-measured 2026-07-07: opt-level 0 is
# 25fps even on a mostly empty map (the Bevy query/iterator generics
# monomorphized into this crate are what need optimizing, and the algorithmic
# perf fixes don't compensate for that), so 1 is the floor for a playable
# `cargo run`. It costs 2× wall / 7× CPU per full crate rebuild vs 0
# (2m46s vs 1m24s measured).
opt-level = 1
# Compile-time trim: cargo's dev default is *thin-local* LTO, not "no LTO".
# Turning it fully off skips a whole-crate pass on every rebuild of this
# 115k-line crate; per-CGU inlining still happens at opt-level 1.
lto = "off"

# Full optimization for dependencies (Bevy, wgpu, image decoders …). They are
# compiled once and cached, so this costs one long cold build and nothing on
# incremental rebuilds — standard Bevy guidance for usable dev-mode perf.
[profile.dev.package."*"]
opt-level = 3

# `package."*"` does NOT cover proc-macros and build scripts — those use
# build-override, whose dev default is opt-level 0. This crate expands 1,100+
# derives (443 of them serde) on every rebuild, so running syn/serde_derive/
# rustpython_derive/bevy's macros optimized pays for itself immediately.
[profile.dev.build-override]
opt-level = 3

# Day-to-day `cargo run --release` profile: cargo defaults (16 codegen units,
# no cross-crate LTO), so the final mud2 crate compiles in parallel instead of
# pinning one core for minutes after every source change.
# `panic = "abort"` would conflict with `bevy_dylib` (default `dynamic_linking`
# feature), which must be built with unwinding. Leave panic at the default
# `unwind` so `cargo build --release` works without `--no-default-features`.
[profile.release]

# Distribution profile — used only by packaging/build-appimage.sh. The
# LTO + single-codegen-unit + strip combo buys a smaller, slightly faster
# binary at the cost of a long single-threaded tail compile, which is why it
# lives here and not in `release`.
[profile.dist]
inherits = "release"
strip = "symbols"
lto = "thin"
codegen-units = 1
